name: Daily Tamil Poetry to Gist

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  generate-tamil-poem:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/tamil-poetry/requirements.txt

      - name: Generate and publish Tamil poem
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-4-hydrogen
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          TAMIL_POETRY_GIST_ID: ${{ secrets.TAMIL_POETRY_GIST_ID }}
        run: |
          python scripts/tamil-poetry/tamil_poetry_daily_to_gist.py

      - name: Sync chapters.json to public folder
        run: |
          mkdir -p public/docs/tamil-poetry
          cp docs/tamil-poetry/chapters.json public/docs/tamil-poetry/chapters.json

      - name: Commit and push updated files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/tamil-poetry/chapters.json public/docs/tamil-poetry/chapters.json
          git diff --staged --quiet || git commit -m "Update Tamil Poetry files after poem generation"
          git push
