name: Daily Monsoon Street Drama Scene

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  generate-scene:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check if drama is complete
        id: check_completion
        run: |
          if [ -f docs/monsoon-street/chapters.json ]; then
            COMPLETED=$(jq -r '.completed' docs/monsoon-street/chapters.json)
            if [ "$COMPLETED" = "true" ]; then
              echo "skip_generation=true" >> $GITHUB_OUTPUT
            else
              echo "skip_generation=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "skip_generation=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check_completion.outputs.skip_generation != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/monsoon-street/requirements.txt

      - name: Generate and publish next scene
        if: steps.check_completion.outputs.skip_generation != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-4-hydrogen
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          MONSOON_STREET_GIST_ID: ${{ secrets.MONSOON_STREET_GIST_ID }}
        run: |
          python scripts/monsoon-street/drama_daily_to_gist.py

      - name: Sync to public folder
        if: steps.check_completion.outputs.skip_generation != 'true'
        run: |
          mkdir -p public/docs/monsoon-street
          cp docs/monsoon-street/chapters.json public/docs/monsoon-street/chapters.json

      - name: Commit and push updated files
        if: steps.check_completion.outputs.skip_generation != 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/monsoon-street/ public/docs/monsoon-street/
          git diff --staged --quiet || git commit -m "Update Monsoon Street drama scene"
          git push
