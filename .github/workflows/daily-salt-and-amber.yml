name: Daily Salt & Amber Poem to Gist

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  generate-poem:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/salt-and-amber/requirements.txt

      - name: Generate and publish poem
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-4-hydrogen
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          SALT_AND_AMBER_GIST_ID: ${{ secrets.SALT_AND_AMBER_GIST_ID }}
        run: |
          python scripts/salt-and-amber/salt_and_amber_daily_to_gist.py

      - name: Sync chapters.json to public folder
        run: |
          mkdir -p public/docs/salt-and-amber
          cp docs/salt-and-amber/chapters.json public/docs/salt-and-amber/chapters.json

      - name: Commit and push updated files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/salt-and-amber/chapters.json public/docs/salt-and-amber/chapters.json
          git diff --staged --quiet || git commit -m "Update Salt & Amber files after poem generation"
          git push
