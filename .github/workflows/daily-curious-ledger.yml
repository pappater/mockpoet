name: Daily Curious Ledger Essay to Gist

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  generate-essay:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/curious-ledger/requirements.txt

      - name: Generate and publish daily essay
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-4-hydrogen
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          CURIOUS_LEDGER_GIST_ID: ${{ secrets.CURIOUS_LEDGER_GIST_ID }}
        run: |
          python scripts/curious-ledger/essay_daily_to_gist.py

      - name: Sync chapters.json to public folder
        run: |
          mkdir -p public/docs/curious-ledger
          cp docs/curious-ledger/chapters.json public/docs/curious-ledger/chapters.json

      - name: Commit and push updated files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/curious-ledger/chapters.json public/docs/curious-ledger/chapters.json
          git diff --staged --quiet || git commit -m "Update Curious Ledger after daily essay generation"
          git push
